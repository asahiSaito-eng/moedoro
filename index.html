<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer — 星降る夜のポモドーロ</title>
  <meta name="description" content="幻想的な魔法の世界に没入できるポモドーロタイマー。美しい一枚絵の世界観で集中力を高めましょう。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Quicksand:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=16">
</head>
<body>
  <!-- 背景画像 -->
  <div id="background"></div>

  <!-- 流星・彗星の軌跡描画用キャンバス -->
  <canvas id="trail-canvas"></canvas>

  <!-- 破片コンテナ（上下に優しく浮遊するハート） -->
  <div id="fragments-container"></div>

  <!-- タイマー表示（女の子の左側に分、右側に秒を配置） -->
  <div id="timer-split-container">
    <!-- 左側: 分（女の子の左側） -->
    <div id="timer-left-group" class="timer-side-group">
      <div class="timer-digit-slot" id="minutes-slot">
        <span class="timer-digit-item">25</span>
      </div>
      <span class="timer-unit-label">MIN</span>
    </div>

    <!-- 右側: 秒（女の子の右側） -->
    <div id="timer-right-group" class="timer-side-group">
      <div class="timer-digit-slot" id="seconds-slot">
        <span class="timer-digit-item">00</span>
      </div>
      <span class="timer-unit-label">SEC</span>
    </div>
  </div>

  <!-- フェーズインジケーター -->
  <div id="phase-indicator">
    <span id="phase-text">集中</span>
  </div>

  <!-- コントロールエリア（右下） -->
  <div id="controls">
    <button id="btn-pause" title="一時停止 / 再開" aria-label="一時停止 / 再開">
      <!-- Play / Pause SVG Icon -->
      <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
        <polygon points="6,4 20,12 6,20" />
      </svg>
      <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" width="20" height="20" style="display:none;">
        <rect x="5" y="4" width="4" height="16" />
        <rect x="15" y="4" width="4" height="16" />
      </svg>
    </button>
    <button id="btn-sound" title="効果音 ON / OFF" aria-label="効果音 ON / OFF">
      <svg id="icon-sound-on" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
      </svg>
      <svg id="icon-sound-off" viewBox="0 0 24 24" fill="currentColor" width="20" height="20" style="display:none;">
        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
      </svg>
    </button>
    <button id="btn-settings" title="設定" aria-label="設定">
      <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
        <path d="M19.14,12.94a7.07,7.07,0,0,0,.06-.94,7.07,7.07,0,0,0-.06-.94l2.03-1.58a.49.49,0,0,0,.12-.61l-1.92-3.32a.49.49,0,0,0-.59-.22l-2.39.96a7.04,7.04,0,0,0-1.62-.94l-.36-2.54a.48.48,0,0,0-.48-.41h-3.84a.48.48,0,0,0-.48.41l-.36,2.54a7.04,7.04,0,0,0-1.62.94l-2.39-.96a.49.49,0,0,0-.59.22L3.71,8.87a.48.48,0,0,0,.12.61l2.03,1.58a7.07,7.07,0,0,0-.06.94,7.07,7.07,0,0,0,.06.94L3.83,14.52a.49.49,0,0,0-.12.61l1.92,3.32a.49.49,0,0,0,.59.22l2.39-.96a7.04,7.04,0,0,0,1.62.94l.36,2.54a.48.48,0,0,0,.48.41h3.84a.48.48,0,0,0,.48-.41l.36-2.54a7.04,7.04,0,0,0,1.62-.94l2.39.96a.49.49,0,0,0,.59-.22l1.92-3.32a.49.49,0,0,0-.12-.61ZM12,15.6A3.6,3.6,0,1,1,15.6,12,3.6,3.6,0,0,1,12,15.6Z"/>
      </svg>
    </button>
  </div>

  <!-- 破片位置エディタツールバー（調整モード時のみ表示） -->
  <div id="editor-toolbar" style="display: none;">
    <div class="editor-header">
      <span class="editor-title">💎 破片調整エディタ</span>
      <span class="editor-hint">各破片をドラッグまたは矢印キーで微調整できます</span>
    </div>
    <div class="editor-controls">
      <div class="editor-btn-group">
        <span class="group-label">全体移動:</span>
        <button id="ed-move-up" title="全体を上へ">↑</button>
        <button id="ed-move-down" title="全体を下へ">↓</button>
        <button id="ed-move-left" title="全体を左へ">←</button>
        <button id="ed-move-right" title="全体を右へ">→</button>
      </div>
      <div class="editor-btn-group">
        <span class="group-label">全体サイズ:</span>
        <button id="ed-scale-down" title="全体縮小">−</button>
        <button id="ed-scale-up" title="全体拡大">＋</button>
      </div>
      <div class="editor-btn-group">
        <button id="ed-copy-code" class="btn-highlight" title="コードをクリップボードにコピー">📋 コードをコピー</button>
        <button id="ed-reset" title="初期配置にリセット">初期化</button>
        <button id="ed-close" class="btn-close" title="エディタを閉じる">✕ 完了</button>
      </div>
    </div>
    <div id="editor-status">破片をクリックして選択、ドラッグまたは矢印キーで移動 [DキーでON/OFF]</div>
  </div>

  <!-- 設定モーダル -->
  <div id="settings-modal" class="modal-overlay" style="display:none;">
    <div id="settings-panel">
      <h2>設定</h2>
      <div class="setting-row">
        <label for="input-focus">集中時間（分）</label>
        <input type="number" id="input-focus" min="1" max="90" value="25">
      </div>
      <div class="setting-row">
        <label for="input-break">休憩時間（分）</label>
        <input type="number" id="input-break" min="1" max="30" value="5">
      </div>
      <div class="setting-row">
        <label for="select-speed">タイマー速度</label>
        <select id="select-speed">
          <option value="1">1倍速（通常）</option>
          <option value="2">2倍速</option>
          <option value="5">5倍速</option>
          <option value="30">30倍速（テスト用）</option>
        </select>
      </div>
      <div class="setting-row">
        <label>ハート位置の調整</label>
        <button id="btn-open-editor" type="button" class="btn-setting-action">🛠️ 位置調整モード</button>
      </div>
      <div class="modal-buttons">
        <button id="btn-save-settings">保存</button>
        <button id="btn-cancel-settings">キャンセル</button>
      </div>
    </div>
  </div>

  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="main.js?v=16"></script>
</body>
</html>
